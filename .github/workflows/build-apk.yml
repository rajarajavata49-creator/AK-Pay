
name: AK Pay APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check AK Pay source
        run: |
          test -s index.html
          test -s logo.png

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install Android platform
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare AK Pay
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install --save-exact @capacitor/core@7.4.3 @capacitor/android@7.4.3
          npm install --save-dev --save-exact @capacitor/cli@7.4.3

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.akpay.demo",
            "appName": "AK Pay Demo",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Generate AK Pay App Icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os

          img = Image.open("logo.png").convert("RGBA")
          img.thumbnail((1024, 1024), Image.Resampling.LANCZOS)

          base = Image.new("RGBA", (1024, 1024), (255, 255, 255, 0))
          base.alpha_composite(
              img,
              ((1024 - img.width) // 2, (1024 - img.height) // 2)
          )

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)

              icon = base.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(f"{folder}/ic_launcher.png")
              icon.save(f"{folder}/ic_launcher_round.png")

          adaptive = "android/app/src/main/res/mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = os.path.join(adaptive, name)
              if os.path.exists(path):
                  os.remove(path)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AK-Pay-Demo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
